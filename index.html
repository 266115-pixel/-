<!-- PeerJS 연결 -->
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

<!-- 통화 UI -->
<div id="callbox" style="display:none">
  <h3>🎙 음성 통화</h3>
  <div id="callstatus">통화 대기 중</div>
  <button id="callbtn">📞 음성 통화</button>
  <button id="hangcall">☎ 통화 종료</button>
</div>

<script>
let friendPeer = null;
let activeFriend = "";
let friendCall = null;
let friendCallStream = null;
let friendCallAudio = null;
let friendCallTimer = null;

const callStatus = text => {
  const el = document.getElementById("callstatus");
  if (el) el.textContent = text;
};

function showCall(status) {
  document.getElementById("callbox").style.display = "block";
  callStatus(status);
}

function startCallTimer() {
  let sec = 0;
  friendCallTimer = setInterval(() => {
    sec++;
    callStatus(
      "통화 중 · " +
      String(Math.floor(sec / 60)).padStart(2, "0") +
      ":" +
      String(sec % 60).padStart(2, "0")
    );
  }, 1000);
}

function endCall() {
  if (friendCallTimer) {
    clearInterval(friendCallTimer);
    friendCallTimer = null;
  }

  if (friendCall) {
    try { friendCall.close(); } catch (e) {}
    friendCall = null;
  }

  if (friendCallStream) {
    friendCallStream.getTracks().forEach(track => track.stop());
    friendCallStream = null;
  }

  if (friendCallAudio) {
    friendCallAudio.srcObject = null;
    friendCallAudio.remove();
    friendCallAudio = null;
  }

  document.getElementById("callbox").style.display = "none";
  document.getElementById("callbtn").disabled = false;
  document.getElementById("callbtn").textContent = "📞 음성 통화";
}

async function startFriendCall() {
  if (!activeFriend || !friendPeer) {
    callStatus("친구 연결을 먼저 확인하세요");
    return;
  }

  if (!window.isSecureContext ||
      !navigator.mediaDevices?.getUserMedia) {
    callStatus("HTTPS 또는 localhost에서 실행해야 합니다.");
    return;
  }

  try {
    callStatus("마이크 권한 요청 중…");

    friendCallStream =
      await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });

    const call = friendPeer.call(
      activeFriend,
      friendCallStream
    );

    if (!call) {
      endCall();
      callStatus("상대방이 온라인인지 확인하세요.");
      return;
    }

    friendCall = call;
    showCall("상대방 연결 중…");

    call.on("stream", stream => {
      friendCallAudio = document.createElement("audio");
      friendCallAudio.autoplay = true;
      friendCallAudio.playsInline = true;
      friendCallAudio.srcObject = stream;
      document.body.appendChild(friendCallAudio);

      friendCallAudio.play().catch(() => {});
      showCall("통화 연결됨");
      startCallTimer();
    });

    call.on("close", endCall);
    call.on("error", endCall);

  } catch (error) {
    endCall();
    callStatus("마이크 권한을 확인해 주세요.");
  }
}

function acceptFriendCall(call) {
  if (!window.isSecureContext ||
      !navigator.mediaDevices?.getUserMedia) {
    call.close();
    alert("HTTPS 또는 localhost에서 실행해야 합니다.");
    return;
  }

  navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    },
    video: false
  }).then(stream => {
    friendCallStream = stream;
    friendCall = call;

    showCall("상대방 연결 중…");
    call.answer(stream);

    call.on("stream", remoteStream => {
      friendCallAudio = document.createElement("audio");
      friendCallAudio.autoplay = true;
      friendCallAudio.playsInline = true;
      friendCallAudio.srcObject = remoteStream;
      document.body.appendChild(friendCallAudio);

      friendCallAudio.play().catch(() => {});
      showCall("통화 연결됨");
      startCallTimer();
    });

    call.on("close", endCall);
    call.on("error", endCall);

  }).catch(() => {
    call.close();
    alert("마이크 권한을 허용해 주세요.");
  });
}

// 통화 버튼
document.getElementById("callbtn")
  .addEventListener("click", startFriendCall);

// 통화 종료 버튼
document.getElementById("hangcall")
  .addEventListener("click", endCall);

// PeerJS에서 전화가 오면 수락 여부 확인
function setupIncomingCall(peer) {
  friendPeer = peer;

  friendPeer.on("call", call => {
    const accept = confirm(
      "친구가 음성 통화를 걸었습니다. 받을까요?"
    );

    if (accept) {
      acceptFriendCall(call);
    } else {
      call.close();
    }
  });
}
</script>
