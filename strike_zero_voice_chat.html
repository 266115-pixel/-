function voiceStatus(msg){const el=Q('#voicestatus');if(el)el.textContent=msg}
function attachVoiceAudio(stream){let a=Q('#voiceaudio');if(!a){a=document.createElement('audio');a.id='voiceaudio';a.autoplay=true;a.playsInline=true;a.style.display='none';document.body.appendChild(a)}a.srcObject=stream;const pr=a.play();if(pr&&pr.catch)pr.catch(()=>voiceStatus('상대 음성 재생을 눌러 허용해 주세요.'))}

async function getVoiceStream(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('이 브라우저에서 마이크를 사용할 수 없어요. HTTPS 또는 localhost에서 열어 주세요.');return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})}
async function startVoiceCall(){if(!activeFriend)return;ensureFriendPeer();if(!friendPeer){voiceStatus('음성 연결 서버에 접속하지 못했어요.');return}if(activeVoiceCall){voiceStatus('이미 통화 중이에요.');return}try{voiceStatus('마이크 권한을 기다리는 중…');localVoiceStream=await getVoiceStream();voiceFriendCode=activeFriend;voiceStatus('친구에게 통화 연결 중…');const call=friendPeer.call(activeFriend,localVoiceStream);if(!call)throw new Error('통화를 시작할 수 없어요.');activeVoiceCall=call;call.on('stream',stream=>{attachVoiceAudio(stream);voiceStatus('🔊 음성 통화 중')});call.on('close',stopVoiceCall);call.on('error',e=>{voiceStatus('통화 연결 오류: '+(e?.type||'확인 필요'));stopVoiceCall()});const b=Q('#voicecall');if(b)b.textContent='📞 연결 중…';const h=Q('#voicehang');if(h)h.style.display='inline-block'}catch(e){voiceStatus(e?.message||'마이크를 사용할 수 없어요. 권한을 확인해 주세요.');if(localVoiceStream){localVoiceStream.getTracks().forEach(t=>t.stop());localVoiceStream=null}}}

function ensureFriendPeer(){

  friendPeer=new Peer(getCode());
  friendPeer.on('connection',c=>{friendConns.set(c.peer,c);c.on('data',d=>receiveFriendMsg(c.peer,d));c.on('close',()=>friendConns.delete(c.peer));c.on('error',()=>friendConns.delete(c.peer))});

  friendPeer.on('error',e=>{if(e.type==='unavailable-id'){friendPeer=null;setTimeout(ensureFriendPeer,1500)}});
 }catch(e){friendPeer=null}
}
function receiveFriendMsg(peer,d){

}

function sendFriendChat(){

 }catch(e){const st=Q('#chatstatus');if(st)st.textContent='전송 실패: 연결을 만들 수 없어요.'}
}
